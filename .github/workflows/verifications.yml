# Vérifications automatiques à chaque envoi sur GitHub : l'appli compile, les règles d'accès de la base
# tiennent (47 tests), les calculs et la sécurité côté serveur (QR signé, webhook Stripe) sont corrects.
name: Vérifications
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  appli:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
  base-de-donnees:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: test }
    steps:
      - uses: actions/checkout@v4
      - name: Schéma et règles d'accès
        run: |
          psql -v ON_ERROR_STOP=1 -q -f app/supabase/tests/imitation_supabase.sql
          for f in app/supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -v ON_ERROR_STOP=1 -q -f app/supabase/tests/regles_acces.sql > /dev/null
  serveur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - working-directory: app/supabase/functions
        run: deno check */index.ts && deno test --allow-env _tests/
