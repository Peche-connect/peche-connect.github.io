# Vérifications automatiques à chaque envoi sur GitHub :
#  1. l'appli compile ;
#  2. le serveur Firebase : calculs, règles d'accès (base + fichiers) et fonctions de bout en bout,
#     sur les émulateurs Firebase avec une copie locale de Stripe (stripe-mock) ;
#  3. le parcours complet dans un vrai navigateur (client, pêcheur, paiement, messages, vocal).
name: Vérifications
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  appli:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit

  serveur:
    runs-on: ubuntu-latest
    services:
      stripe:
        image: stripe/stripe-mock:latest
        ports: ['12111:12111']
    defaults: { run: { working-directory: app/firebase } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Fonctions (compilation + calculs)
        working-directory: app/firebase/functions
        run: npm ci && npm run test:unitaires
      - name: Réglages de test des émulateurs (fausses clés)
        run: |
          printf 'STRIPE_SECRET_KEY=sk_test_123\nSTRIPE_WEBHOOK_SECRET=whsec_test_peche_connect\nSTRIPE_WEBHOOK_SECRET_CONNECT=-\nQR_SECRET=cle-qr-de-test-longue-0123456789\n' > functions/.secret.local
          printf 'STRIPE_API_HOTE=127.0.0.1:12111\nSITE_URL=http://localhost:8091\n' > functions/.env.local
      - run: npm ci
        working-directory: app/firebase/tests
      - name: Règles d'accès (base + fichiers)
        run: npx -y firebase-tools@14 emulators:exec --project demo-peche-connect --only firestore,storage "npm --prefix tests run regles"
      - name: Fonctions serveur de bout en bout
        run: npx -y firebase-tools@14 emulators:exec --project demo-peche-connect --only auth,firestore,storage,functions "npm --prefix tests run fonctions"

  parcours:
    runs-on: ubuntu-latest
    services:
      stripe:
        image: stripe/stripe-mock:latest
        ports: ['12111:12111']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Fonctions serveur
        working-directory: app/firebase/functions
        run: |
          npm ci && npm run build
          printf 'STRIPE_SECRET_KEY=sk_test_123\nSTRIPE_WEBHOOK_SECRET=whsec_test_peche_connect\nSTRIPE_WEBHOOK_SECRET_CONNECT=-\nQR_SECRET=cle-qr-de-test-longue-0123456789\n' > .secret.local
          printf 'STRIPE_API_HOTE=127.0.0.1:12111\nSITE_URL=http://localhost:8091\n' > .env.local
      - name: Site en mode réel, branché sur les émulateurs
        working-directory: app
        env:
          EXPO_OFFLINE: '1'
          EXPO_PUBLIC_FIREBASE_API_KEY: cle-de-test
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: localhost
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: demo-peche-connect
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-peche-connect.appspot.com
          EXPO_PUBLIC_FIREBASE_APP_ID: '1:1:web:1'
          EXPO_PUBLIC_FIREBASE_EMULATEUR: 127.0.0.1
          EXPO_PUBLIC_SITE_URL: http://localhost:8091
          EXPO_PUBLIC_CONNEXION_GOOGLE: '0'
        run: npm ci && npx expo export --platform web --clear --output-dir /tmp/site
      - name: Navigateur de test
        working-directory: app/firebase/tests
        run: npm ci && npx playwright install --with-deps chromium
      - name: Parcours client / pêcheur de bout en bout
        working-directory: app/firebase
        run: |
          node tests/serveur-site.mjs /tmp/site 8091 &
          npx -y firebase-tools@14 emulators:exec --project demo-peche-connect --only auth,firestore,storage,functions "npm --prefix tests run parcours"
      - name: Captures d'écran du parcours
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: captures-parcours, path: /tmp/captures, if-no-files-found: ignore }
