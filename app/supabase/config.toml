# Réglages Supabase CLI (supabase link / db push / functions deploy)
project_id = "peche-connect"

# Fonctions appelées par Stripe, par Supabase Auth ou par une tâche planifiée :
# elles vérifient elles-mêmes leur signature / leur clé, sans jeton d'utilisateur.
[functions.stripe-webhook]
verify_jwt = false

[functions.envoi-sms]
verify_jwt = false

[functions.notifier]
verify_jwt = false
